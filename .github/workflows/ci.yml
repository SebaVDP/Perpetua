name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Cairn.slnx

      - name: Build
        run: dotnet build Cairn.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project test/Cairn.Tests/Cairn.Tests.csproj --configuration Release --no-build

  mutation:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Cairn.slnx

      - name: Mutation test
        working-directory: test/Cairn.Tests
        run: dotnet stryker --project Cairn.Structurizr.csproj --test-runner mtp

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: test/Cairn.Tests/StrykerOutput/**/reports/*.html
          if-no-files-found: ignore
