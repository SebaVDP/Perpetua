name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Cairn.slnx

      - name: Build
        run: dotnet build Cairn.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet run --project test/Cairn.Tests/Cairn.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Cairn/Cairn.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output artifacts
          dotnet pack src/Cairn.Structurizr/Cairn.Structurizr.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.nupkg
