name: Release

on:
  push:
    tags: [ 'perpetua-v*', 'structurizr-v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive package and version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            perpetua-v*)    echo "project=src/Perpetua/Perpetua.csproj" >> "$GITHUB_OUTPUT"
                            echo "version=${GITHUB_REF_NAME#perpetua-v}" >> "$GITHUB_OUTPUT" ;;
            structurizr-v*) echo "project=src/Perpetua.Structurizr/Perpetua.Structurizr.csproj" >> "$GITHUB_OUTPUT"
                            echo "version=${GITHUB_REF_NAME#structurizr-v}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore
        run: dotnet restore Perpetua.slnx

      - name: Build
        run: dotnet build Perpetua.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet run --project test/Perpetua.Structurizr.Tests/Perpetua.Structurizr.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack ${{ steps.version.outputs.project }} --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: NuGet login (Trusted Publishing via OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: artifacts/*.nupkg
